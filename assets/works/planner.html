<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planner Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --canvas: #09090B;
      --surface: #121214;
      --ivory: #F4F0E6;
      --muted: #8A8478;
      --ember: #FF4D1C;
      --hairline: rgba(245, 240, 232, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--canvas);
      color: var(--ivory);
      font-family: Outfit, sans-serif;
      min-height: 100vh;
      padding: 28px;
    }
    .os {
      max-width: 920px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--hairline);
      padding-bottom: 16px;
    }
    header strong { font-weight: 500; letter-spacing: -0.02em; }
    header span {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 18px;
    }
    .cal, .queue {
      background: var(--surface);
      border: 1px solid var(--hairline);
      padding: 20px;
    }
    .label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .days span {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      font-size: 13px;
      color: var(--muted);
    }
    .days span.hot {
      background: var(--ember);
      color: #1a0905;
      font-weight: 600;
    }
    .days span.in { color: var(--ivory); }
    li {
      list-style: none;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--hairline);
      font-size: 14px;
    }
    li em { font-style: normal; color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 11px; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="os">
    <header>
      <strong>Planner Hub</strong>
      <span>Week 36 · 2026</span>
    </header>
    <div class="grid">
      <section class="cal">
        <p class="label">September</p>
        <div class="days" aria-hidden="true">
          <span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span>
          <span></span><span class="in">1</span><span class="in">2</span><span class="in">3</span><span class="in">4</span><span class="in">5</span><span class="in">6</span>
          <span class="in">7</span><span class="in">8</span><span class="in">9</span><span class="in">10</span><span class="in">11</span><span class="in">12</span><span class="in">13</span>
          <span class="in">14</span><span class="in">15</span><span class="in">16</span><span class="in">17</span><span class="in">18</span><span class="in">19</span><span class="in">20</span>
          <span class="in">21</span><span class="in">22</span><span class="in">23</span><span class="in hot">24</span><span class="in">25</span><span class="in">26</span><span class="in">27</span>
          <span class="in">28</span><span class="in">29</span><span class="in">30</span>
        </div>
      </section>
      <section class="queue">
        <p class="label">실행 큐</p>
        <ul>
          <li>주간 리뷰 초안 <em>09:30</em></li>
          <li>스튜디오 톤 교정 <em>11:00</em></li>
          <li>론칭 키비주얼 컷 <em>15:40</em></li>
          <li>Q4 가용 캘린더 <em>18:00</em></li>
        </ul>
      </section>
    </div>
  </div>
</body>
</html>
